services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: localdiscovery
      POSTGRES_PASSWORD: localdiscovery
      POSTGRES_DB: localdiscovery
    ports:
      - "5432:5432"
    volumes:
      - ld_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localdiscovery -d localdiscovery"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  ld_pgdata:
